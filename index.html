<style>
  :root{
    --navy:#12335f;
    --navy-2:#0d2748;
    --blue:#2f6fb0;
    --gold:#e0a63c;
    --muted:#8595a6;
    --text:#1c2733;
    --bg:#eef1f6;
    --card:#ffffff;
    --border:#dfe6ee;
    --red:#e60124;
    --red-bg:#fde6ea;
    --yellow:#ffa800;
    --yellow-bg:#fff4e0;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
  }
  header.global-header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    background:#ffffff;
    border-bottom:1px solid var(--border);
    box-shadow:0 2px 10px rgba(18,51,95,0.05);
    gap:16px;
    flex-wrap:wrap;
  }
  .brand-left .brand-name{
    font-family:"Poppins","Segoe UI",sans-serif;
    font-weight:800;
    font-size:1.35rem;
    letter-spacing:0.04em;
    color:var(--navy);
  }
  .brand-left .brand-sub{
    font-family:"Poppins","Segoe UI",sans-serif;
    color:var(--gold);
    font-size:0.82rem;
    font-weight:600;
    letter-spacing:0.03em;
    margin-top:2px;
  }
  .center-title{
    text-align:center;
  }
  .center-title .t1{
    font-family:"Poppins","Segoe UI",sans-serif;
    font-size:1.3rem;
    font-weight:700;
    letter-spacing:0.015em;
    color:var(--navy);
  }
  .center-title .t2{
    font-family:"Poppins","Segoe UI",sans-serif;
    font-size:0.8rem;
    font-weight:500;
    color:var(--muted);
    margin-top:3px;
  }
  .header-logo{
    height:56px;
    width:auto;
  }

  .page{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    width:100%;
    padding:8px 10px 8px 10px;
  }

  #statusMsg{
    flex:0 0 auto;
    font-size:0.78rem;
    color:var(--muted);
  }
  #statusMsg:empty{display:none;}
  #statusMsg:not(:empty){padding-bottom:6px;}
  #statusMsg.error{color:var(--red);}

  .table-card{
    flex:0 1 auto;
    min-height:0;
    max-height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
    background:var(--card);
    border-radius:12px;
    box-shadow:0 4px 18px rgba(15,42,74,0.08);
    overflow:hidden;
    border:1px solid var(--border);
  }
  .table-scroll{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    overflow:auto;
  }
  table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
    font-size:0.95rem;
    min-width:1400px;
  }
  thead th{
    background:var(--navy);
    color:#eef3fa;
    text-align:center;
    padding:10px 10px;
    font-size:0.95rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.02em;
    white-space:normal;
    word-break:break-word;
    position:sticky;
    top:0;
    z-index:2;
  }
  thead th[colspan]{
    text-align:center;
  }
  thead tr:last-child th{
    text-align:center;
    padding-top:4px;
    padding-bottom:6px;
    font-size:0.82rem;
    background:var(--navy);
  }
  tbody td{
    padding:13px 6px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
    white-space:nowrap;
    line-height:1.5;
  }
  tbody tr:hover{background:#f7f9fc;}
  tbody tr:nth-child(even){background:#fbfcfe;}
  tbody tr:nth-child(even):hover{background:#f2f5f9;}

  .vessel-name{
    font-weight:800;
    color:var(--navy);
    font-size:1.02rem;
    text-align:center;
  }
  .cell-main{
    font-weight:700;
    display:block;
    text-align:center;
  }
  .cell-tag{
    font-weight:600;
    font-size:0.78rem;
    color:var(--muted);
  }
  .cell-sub{
    display:block;
    font-weight:400;
    color:var(--text);
    font-size:0.88rem;
    white-space:normal;
    margin-top:3px;
    text-align:center;
  }
  td.cell-red .cell-main{color:var(--red);}
  td.cell-red{box-shadow:inset 3px 0 0 var(--red);background:var(--red-bg);}

  td.cell-yellow .cell-main{color:var(--yellow);}
  td.cell-yellow{box-shadow:inset 3px 0 0 var(--yellow);background:var(--yellow-bg);}

  td.cell-text{
    white-space:normal;
    max-width:200px;
  }
  .muted-cell{color:var(--text);text-align:center;}
  .cell-check{text-align:center;}
  .check-yes{
    display:inline-block;
    color:var(--navy);
    font-weight:800;
    font-size:1.05rem;
  }
  .cell-oil{
    display:block;
    text-align:center;
    font-weight:700;
    color:var(--navy);
  }

  .bottomTimestamp{
    position:fixed;
    right:14px;
    bottom:10px;
    font-size:0.72rem;
    color:var(--navy);
    background:rgba(255,255,255,0.96);
    padding:5px 10px;
    border-radius:8px;
    border-left:4px solid var(--gold);
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
  }

  @media (max-width:900px){
    header.global-header{padding:10px 12px;}
    .header-logo{height:42px;}
    .page{padding:10px 12px;}
  }

  /* Màn hình thấp (vd laptop 1600x783): thu gọn khoảng đệm/cỡ chữ để vừa 1 màn hình,
     đỡ phải cuộn trong khung bảng. Màn hình cao hơn 800px vẫn giữ cỡ chữ/độ giãn dòng lớn hơn. */
  @media (max-height:800px){
    header.global-header{padding:5px 12px;}
    .header-logo{height:34px;}
    .page{padding:3px 10px;}
    table{font-size:0.82rem;}
    thead th{padding:5px 6px;font-size:0.8rem;white-space:normal;word-break:normal;}
    thead tr:last-child th{padding-top:2px;padding-bottom:2px;font-size:0.7rem;}
    tbody td{padding:5px 6px;line-height:1.25;}
    .cell-sub{font-size:0.74rem;margin-top:1px;}
    .vessel-name{font-size:0.88rem;}
  }
</style>
</head>
<body>

<header class="global-header" role="banner">
  <div class="brand-left">
    <div class="brand-name">AULAC CORPORATION</div>
    <div class="brand-sub">Energy on the move</div>
  </div>
  <div class="center-title">
    <div class="t1">LỊCH KIỂM TRA &amp; ĐÁNH GIÁ ĐỘI TÀU</div>

const GENERAL_RED = 30;
const GENERAL_YELLOW = 60;
const CERT_RED = 120;   // SMC / ISSC / MLC
const CERT_YELLOW = 180;

// ---------- CSV parsing (hỗ trợ ô có dấu ngoặc kép / xuống dòng) ----------
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(field); field = "";
      } else if (c === '\r') {
        // skip
      } else if (c === '\n') {
        row.push(field); field = "";
        rows.push(row); row = [];
      } else {
        field += c;
      }
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

// ---------- Date helpers ----------
// Chấp nhận d/m/yy hoặc d/m/yyyy. Trả về Date (local, 00:00) hoặc null nếu không parse được.
function parseVNDate(str) {
  if (!str) return null;
  const s = str.trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (!m) return null;
  let day = parseInt(m[1], 10);
  let month = parseInt(m[2], 10);
  let year = parseInt(m[3], 10);
  if (year < 100) year += 2000;
  if (month < 1 || month > 12 || day < 1 || day > 31) return null;
  const d = new Date(year, month - 1, day);
  if (d.getMonth() !== month - 1) return null; // ngày không hợp lệ (vd 31/02)
  return d;
}

function formatDate(d) {
  if (!d) return "";
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const yyyy = d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

function daysBetween(from, to) {
  const MS = 24 * 60 * 60 * 1000;
  const a = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  const b = new Date(to.getFullYear(), to.getMonth(), to.getDate());
  return Math.round((b - a) / MS);
}

// Gộp nhiều chuỗi ứng viên (có thể là ngày cụ thể hoặc text mô tả "cửa sổ" khảo sát)
// -> trả về { date: Date|null, label: string }  (label = phần text không parse được ngày)
function resolveDateGroup(candidates) {
  const clean = candidates.map(c => (c || "").trim()).filter(c => c.length > 0);
  let bestDate = null;   // ngày gần nhất/lớn nhất (dùng để tính đếm ngược + tô màu)
  let firstDate = null;  // ngày nhỏ nhất, nếu có >=2 ngày hợp lệ khác nhau -> hiển thị đủ cả khoảng
  const labels = [];
  for (const c of clean) {
    const d = parseVNDate(c);
    if (d) {
      if (!bestDate || d > bestDate) bestDate = d;
      if (!firstDate || d < firstDate) firstDate = d;
    } else {
      if (!labels.includes(c)) labels.push(c);
    }
  }
  const prevDate = (firstDate && bestDate && firstDate.getTime() !== bestDate.getTime()) ? firstDate : null;
  return { date: bestDate, prevDate, label: labels.join(" | ") };
}

// ---------- Render helpers ----------
function classify(days, isCert) {
  if (days === null || days === undefined) return "";
  const red = isCert ? CERT_RED : GENERAL_RED;
  const yellow = isCert ? CERT_YELLOW : GENERAL_YELLOW;
  if (days < red) return "cell-red";
  if (days < yellow) return "cell-yellow";
  return ""; // còn hạn an toàn: không tô màu, chữ đen bình thường
}

function dateCellHTML(dateGroup, today, isCert, forcePlain) {
  const { date, prevDate, label, tag } = dateGroup;
  if (!date && !label) return { cls: "", html: "" };
  if (!date) {
    // chỉ có text mô tả, không có ngày cụ thể để tính đếm ngược
    return { cls: "", html: `<span class="cell-sub">${escapeHTML(label)}</span>` };
  }
  const days = daysBetween(today, date);
  const cls = forcePlain ? "" : classify(days, isCert);
  // Nếu Sheet có 2 ngày hợp lệ khác nhau (vd hiệu lực từ - đến), hiển thị đủ cả khoảng
  // thay vì chỉ giữ ngày gần nhất và bỏ ngày còn lại.
  let html = `<span class="cell-main">${formatDate(date)}</span>`;
  if (tag) html += ` <span class="cell-tag">(${escapeHTML(tag)})</span>`;
  if (prevDate) {
    // Có 2 ngày hợp lệ (vd hiệu lực từ - đến): giữ ngày sau làm mốc chính (đậm, tô màu cảnh báo),
    // ngày đầu xuống dòng phụ nhỏ bên dưới để không tràn sang cột kế bên.
    html += `<span class="cell-sub">(${formatDate(prevDate)})</span>`;
  } else if (label) {
    html += `<span class="cell-sub">${escapeHTML(label)}</span>`;
  }
  return { cls, html };
}

// CGO AUD có 2 đợt (External / Internal), vẫn hiển thị đủ 2 cột.
// Nhưng chỉ tô màu cảnh báo (đỏ/vàng/xanh) cho đợt nào có ngày GẦN với hôm nay
// nhất (dù là quá hạn hay sắp tới) — đợt còn lại hiển thị ngày bình thường, không tô màu,
// để tránh trường hợp 1 ngày đã quá hạn rất lâu (vd nhiều năm trước) vẫn bị báo đỏ song song.
function pickCgoPlainFlags(extGroup, intGroup, today) {
  if (!extGroup.date || !intGroup.date) return { extPlain: false, intPlain: false };
  const distExt = Math.abs(daysBetween(today, extGroup.date));
  const distInt = Math.abs(daysBetween(today, intGroup.date));
  return distExt <= distInt
    ? { extPlain: false, intPlain: true }
    : { extPlain: true, intPlain: false };
}

function escapeHTML(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function textCell(str) {
  return escapeHTML(str || "").replace(/\n/g, "<br>");
}

// ---------- Gộp dữ liệu 2 dòng Excel (dòng chính + dòng phụ) thành 1 record/tàu ----------
function buildVesselRecords(rows) {
  // Tìm dòng header thực (chứa "SHIP NAME") để bỏ qua các dòng tiêu đề phía trên
  let startIdx = rows.findIndex(r => (r[0] || "").trim().toUpperCase() === "SHIP NAME");
  if (startIdx === -1) startIdx = 0;
  const dataRows = rows.slice(startIdx + 2); // bỏ 2 dòng header (tên cột + External/Internal)

  const records = [];
  let i = 0;
  while (i < dataRows.length) {
    const r = dataRows[i];
    const name = (r[0] || "").trim();
    if (!name) { i++; continue; } // dòng trống lạc, bỏ qua
    let cont = [];
    let j = i + 1;
    while (j < dataRows.length && !(dataRows[j][0] || "").trim()) {
      cont.push(dataRows[j]);
      j++;
    }
    records.push({ primary: r, cont });
    i = j;
  }
  return records;
}

// Đọc ô "mốc thời gian cập nhật" do Apps Script ghi vào Sheet mỗi khi có người sửa dữ liệu.
// Quy ước: một ô bất kỳ trong Sheet (đặt ở vùng trống, không dùng cho bảng tàu, ví dụ cột T/U)
// chứa chữ "LAST_UPDATE", và ô ngay bên phải nó chứa chuỗi thời gian (Apps Script tự ghi).
// Quét toàn bộ ô (không cố định cột/dòng) để không bị vướng các ô merge của tiêu đề/khung bảng.
function findSheetTimestamp(rows) {
  for (const r of rows) {
    for (let i = 0; i < r.length; i++) {
      if ((r[i] || "").trim().toUpperCase() === "LAST_UPDATE") {
        return (r[i + 1] || "").trim();
      }
    }
  }
  return "";
}

function cellVal(row, idx) {
  return row && row[idx] !== undefined ? row[idx].trim() : "";
}

function mergeSimple(records, idx) {
  // ưu tiên dòng chính, nếu trống thì lấy dòng phụ (nối bằng \n nếu cả 2 đều có và khác nhau)
  const { primary, cont } = records;
  const p = cellVal(primary, idx);
  const c = cont.map(row => cellVal(row, idx)).filter(v => v).join("\n");
  if (p && c) return p + (p !== c ? "\n" + c : "");
  return p || c;
}

// Cho các cột text gộp từ 2 ô Excel (vd cột "Dung Quất" = N+O do bị merge tiêu đề)
function mergeSimpleMulti(records, idxs) {
  const parts = idxs.map(idx => mergeSimple(records, idx)).filter(v => v);
  return parts.join(" ");
}

function mergeCertGroup(records, idxA, idxB) {
  const { primary, cont } = records;
  const candidates = [cellVal(primary, idxA), cellVal(primary, idxB)];
  cont.forEach(row => {
    candidates.push(cellVal(row, idxA), cellVal(row, idxB));
  });
  return resolveDateGroup(candidates);
}

// Cho các cột 1 ngày duy nhất (Next SIRE, SUPT, INT AUD, NAV AUD, CGO AUD, An ninh):
// gộp giá trị dòng chính + các dòng phụ, ưu tiên ngày hợp lệ mới nhất, phần text còn lại làm ghi chú.
function mergeDateGroup(records, idx) {
  const { primary, cont } = records;
  const candidates = [cellVal(primary, idx)];
  cont.forEach(row => candidates.push(cellVal(row, idx)));
  return resolveDateGroup(candidates);
}

// ---------- Render bảng ----------
function render(records) {
  const today = new Date();
  const tbody = document.getElementById("fleetBody");
  tbody.innerHTML = "";

  records.forEach(rec => {
    const name = cellVal(rec.primary, 0);
    const nextSire = dateCellHTML(mergeDateGroup(rec, 1), today, false);
    const oilMajor = mergeSimple(rec, 2);
    const smcGroup = mergeCertGroup(rec, 3, 4);
    let mlcGroup = mergeCertGroup(rec, 5, 6);
    if (!mlcGroup.date && !mlcGroup.label) {
      // Một số tàu dùng 1 chứng nhận chung cho cả SMC/ISSC và MLC (1 ô merge cả 4 cột trên Sheet),
      // nên dữ liệu chỉ rơi vào 2 cột SMC/ISSC, còn 2 cột MLC trống. Trường hợp này MLC dùng chung
      // giá trị với SMC/ISSC thay vì để trống.
      mlcGroup = smcGroup;
    } else if (!mlcGroup.label && smcGroup.label) {
      // MLC có ngày riêng (tách ra để cảnh báo riêng) nhưng ghi chú "khung thời gian khảo sát"
      // là 1 ô dùng chung cho cả SMC/ISSC và MLC -> hiển thị ghi chú đó ở cả 2 cột, vẫn giữ
      // nguyên ngày riêng của MLC.
      mlcGroup = { ...mlcGroup, label: smcGroup.label };
    }
    const smcIssc = dateCellHTML(smcGroup, today, true);
    const mlc = dateCellHTML(mlcGroup, today, true);
    // Khi SMC/ISSC và MLC trùng khớp hoàn toàn (cùng 1 chứng nhận, cùng ngày) -> gộp 2 ô
    // thành 1 ô rộng để đỡ rối mắt, thay vì lặp lại y hệt 2 lần.
    const certMerged = !!smcIssc.html && smcIssc.html === mlc.html;
    const certCellsHTML = certMerged
      ? `<td colspan="2" class="${smcIssc.cls}">${smcIssc.html}</td>`
      : `<td class="${smcIssc.cls}">${smcIssc.html}</td><td class="${mlc.cls}">${mlc.html}</td>`;
    const supt = dateCellHTML(mergeDateGroup(rec, 7), today, false);
    const intAud = dateCellHTML(mergeDateGroup(rec, 8), today, false);
    const navAud = dateCellHTML(mergeDateGroup(rec, 9), today, false);
    const mooringAud = dateCellHTML(mergeDateGroup(rec, 10), today, false);
    const cgoExtGroup = mergeDateGroup(rec, 11);
    const cgoIntGroup = mergeDateGroup(rec, 12);
    const cgoPlainFlags = pickCgoPlainFlags(cgoExtGroup, cgoIntGroup, today);
    const cgoExt = dateCellHTML(cgoExtGroup, today, false, cgoPlainFlags.extPlain);
    const cgoInt = dateCellHTML(cgoIntGroup, today, false, cgoPlainFlags.intPlain);
    const anNinh = dateCellHTML(mergeDateGroup(rec, 13), today, false);
    const sxDone = mergeSimple(rec, 14).trim().toUpperCase() === "TRUE";
    const dungQuat = mergeSimple(rec, 15);
    const psc = mergeSimple(rec, 16);
    const drill = dateCellHTML(mergeDateGroup(rec, 17), today, false);

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="vessel-name">${escapeHTML(name)}</td>
      <td class="${nextSire.cls}">${nextSire.html}</td>
      <td><span class="cell-oil">${escapeHTML(oilMajor)}</span></td>
      ${certCellsHTML}
      <td class="${supt.cls}">${supt.html}</td>
      <td class="${intAud.cls}">${intAud.html}</td>
      <td class="${navAud.cls}">${navAud.html}</td>
      <td class="${mooringAud.cls}">${mooringAud.html}</td>
      <td class="${cgoExt.cls}">${cgoExt.html}</td>
      <td class="${cgoInt.cls}">${cgoInt.html}</td>
      <td class="${anNinh.cls}">${anNinh.html}</td>
      <td class="muted-cell">${sxDone ? '<span class="check-yes">&#10003;</span> ' : ''}${escapeHTML(dungQuat)}</td>
      <td class="cell-text muted-cell">${textCell(psc)}</td>
      <td class="cell-text ${drill.cls}">${drill.html}</td>
    `;
    tbody.appendChild(tr);
  });
}

// ---------- Load ----------
let isLoading = false;
async function loadData() {
  if (isLoading) return;
  isLoading = true;
  const statusMsg = document.getElementById("statusMsg");
  try {
    const url = CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "_ts=" + Date.now();
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    const records = buildVesselRecords(rows);
    if (records.length === 0) throw new Error("Không tìm thấy dữ liệu tàu trong CSV");
    render(records);
    statusMsg.textContent = "";
    // Ưu tiên 1: mốc "LAST_UPDATE" do Apps Script ghi vào Sheet mỗi lần có người sửa dữ liệu
    // (xem hướng dẫn cài đặt Apps Script kèm theo) -> đúng giờ sửa Sheet thật sự.
    // Ưu tiên 2: header Last-Modified nếu Google có trả (CSV publish thường không có).
    // Ưu tiên 3 (dự phòng): giờ tải trang, ghi rõ để không gây hiểu nhầm là giờ cập nhật dữ liệu.
    const sheetTimestamp = findSheetTimestamp(rows);
    const lastModified = res.headers.get("last-modified");
    statusMsg.className = "";
    const now = new Date();
    const tsEl = document.getElementById("bottomTimestamp");
    if (sheetTimestamp) {
      tsEl.textContent = "Dữ liệu (sheet) cập nhật lúc: " + sheetTimestamp;
    } else if (lastModified) {
      const d = new Date(lastModified);
      tsEl.textContent = "Dữ liệu (sheet) cập nhật lúc: " + d.toLocaleString("vi-VN");
    } else {
      tsEl.textContent = "Trang tải lúc: " + now.toLocaleString("vi-VN") + " (không xác định được giờ sửa file)";
    }
  } catch (err) {
    statusMsg.textContent = "Lỗi tải dữ liệu: " + err.message + " (kiểm tra lại link publish CSV / kết nối mạng).";
    statusMsg.className = "error";
  } finally {
    isLoading = false;
  }
}

loadData();
setInterval(loadData, AUTO_REFRESH_MS);
</script>
